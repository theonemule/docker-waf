apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lightedge
spec:
  gatewayClassName: lightedge
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: gateway.apps.example.test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: lightedge
  hostnames: [gateway.apps.example.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: web
          port: 8080
          weight: 90
        - name: web-canary
          port: 8080
          weight: 10
