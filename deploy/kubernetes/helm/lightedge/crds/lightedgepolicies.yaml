apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lightedgepolicies.lightedge.blaize.net
spec:
  group: lightedge.blaize.net
  scope: Namespaced
  names:
    plural: lightedgepolicies
    singular: lightedgepolicy
    kind: LightEdgePolicy
    shortNames: [lep]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [targetRef]
              properties:
                targetRef:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group: {type: string, enum: [gateway.networking.k8s.io]}
                    kind: {type: string, enum: [HTTPRoute, Gateway]}
                    name: {type: string, minLength: 1, maxLength: 253}
                waf:
                  type: object
                  properties:
                    enabled: {type: boolean, enum: [true]}
                    profile: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
                    paranoiaLevel: {type: integer, minimum: 1, maximum: 4}
                rateLimit:
                  type: object
                  properties:
                    requestsPerSecond: {type: integer, minimum: 0, maximum: 999999}
                maxBodySize:
                  type: string
                  pattern: '^[1-9][0-9]{0,6}[km]?$'
                allowIPs:
                  type: array
                  maxItems: 128
                  items: {type: string}
                healthCheck:
                  type: object
                  required: [enabled]
                  properties:
                    enabled: {type: boolean}
                    path: {type: string}
                    interval: {type: integer, minimum: 5, maximum: 3600}
                    timeout: {type: integer, minimum: 1, maximum: 60}
                    expected: {type: string, pattern: '^[1-5]([0-9]{2}|xx)$'}
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
