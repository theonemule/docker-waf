replicaCount: 1
image:
  repository: ghcr.io/theonemule/lightedge-controller
  tag: "v1.0.0"
  pullPolicy: IfNotPresent
provider:
  # Optional existing Secret containing targets.json, per-target token and CA files.
  # Mutually exclusive with embedded appliance mode.
  targetsSecret: ""
  # Existing Secret with partitions.json and each partition's credentials.
  partitionsSecret: ""
  id: cluster-a
  url: ""
  # Existing Secret containing token and ca.crt. For the bundled appliance,
  # the same Secret must also contain provider.json (hashed token and scopes).
  credentialsSecret: lightedge-provider
controller:
  name: blaize.net/lightedge-controller
  ingressClass: lightedge
  gatewayClass: lightedge
  enableIngress: true
  ingressWildcard: false
  ingressCatchAll: false
  enableGateway: true
  gatewayCatchAllHTTPS: false
  # Explicit opt-in: serve configured certificates, with client-side DNS verification.
  gatewayClientValidatedFrontend: false
  # For external or embedded single-appliance mode only. Partitions specify their own ports.
  extraHTTPPorts: []
  extraHTTPSPorts: []
  enableGRPC: false
  extraTCPPorts: []
  extraUDPPorts: []
  extraTLSPorts: []
  enablePolicies: false
  createClasses: true
  backendMode: clusterip
  nodeAddress: ""
  addresses: []
  interval: 5s
appliance:
  enabled: false
  image: ghcr.io/theonemule/docker-waf:v3.3.0
  adminSecret: lightedge-admin
  adminTLSSecret: lightedge-admin-tls
  serviceType: LoadBalancer
  # Public port -> unprivileged container port, e.g. {port: 8080, targetPort: 18080}.
  extraHTTPPorts: []
  extraHTTPSPorts: []
  extraTCPPorts: []
  extraUDPPorts: []
  extraTLSPorts: []
  # Opt-in shared file configuration, no database. Pre-provision RWX storage
  # and its cluster.json; keep the HMAC key in a Kubernetes Secret.
  ha:
    enabled: false
    replicas: 2
    # Set true for production: require distinct Kubernetes worker hosts.
    requireDistinctNodes: false
    existingClaim: ""
    keySecret: ""
    bootstrap: false
  storage:
    size: 1Gi
    storageClass: ""
