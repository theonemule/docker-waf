apiVersion: v1
kind: PersistentVolume
metadata: {name: lightedge-shared-ha}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2, hard, actimeo=1, lookupcache=none]
  nfs: {server: 192.168.77.11, path: /}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: lightedge-shared-ha, namespace: lightedge-system}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: lightedge-shared-ha
  resources: {requests: {storage: 1Gi}}
