worker_processes auto;
pid @RUN_DIR@/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections @WORKER_CONNECTIONS@;
}

http {
    include /opt/liteedge/etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout @KEEPALIVE_TIMEOUT@;
    client_header_timeout @CLIENT_HEADER_TIMEOUT@s;
    client_body_timeout @CLIENT_BODY_TIMEOUT@s;
    send_timeout @SEND_TIMEOUT@s;
    reset_timedout_connection on;
    client_body_temp_path @RUN_DIR@/client_temp;
    proxy_temp_path @RUN_DIR@/proxy_temp;
    fastcgi_temp_path @RUN_DIR@/fastcgi_temp;
    uwsgi_temp_path @RUN_DIR@/uwsgi_temp;
    scgi_temp_path @RUN_DIR@/scgi_temp;

    # Each request produces one portable JSON Lines record in persistent storage.
    # $request_uri may contain secrets in its query string, so log only $uri.
    map $request_uri $liteedge_route { default "-"; }
    map $server_port $liteedge_external_port {
        @HTTP_PORT@ @PUBLIC_HTTP_PORT@;
        @HTTPS_PORT@ @PUBLIC_HTTPS_PORT@;
        default $server_port;
    }
    log_format liteedge_json escape=json
      '{"type":"http","timestamp":"$time_iso8601","epoch":"$msec",'
      '"request_id":"$request_id","host":"$host","route":"$liteedge_route",'
      '"port":"$liteedge_external_port","listen_port":"$server_port","upstream_addr":"$upstream_addr","method":"$request_method","uri":"$uri",'
      '"status":$status,"ip":"$remote_addr","bytes":$body_bytes_sent,'
      '"duration":"$request_time","upstream_status":"$upstream_status",'
      '"user_agent":"$http_user_agent","action":"-"}';
    access_log @DATA_DIR@/logs/events.jsonl liteedge_json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=liteedge_admin:10m rate=30r/m;

    # Proxy targets are emitted through variables, so nginx resolves names at
    # request time. The entrypoint derives this from /etc/resolv.conf unless
    # LITEEDGE_RESOLVER is explicitly set.
    resolver @RESOLVER@ ipv6=off valid=30s;

    include @DATA_DIR@/nginx/admin.conf;
    include @DATA_DIR@/nginx/sites/*.conf;
}
