server {
    listen @BIND_ADDRESS@:@HTTP_PORT@ default_server;
    http2 on;
    server_name _;

    include /opt/liteedge/etc/nginx/security.conf;

    location ^~ /.well-known/acme-challenge/ {
        root @DATA_DIR@/acme/challenges;
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen @BIND_ADDRESS@:@HTTPS_PORT@ ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen @BIND_ADDRESS@:@ADMIN_HTTPS_PORT@ ssl default_server;
    server_name _;

    ssl_certificate @DATA_DIR@/certs/_admin/fullchain.pem;
    ssl_certificate_key @DATA_DIR@/certs/_admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ADMINSSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    include /opt/liteedge/etc/nginx/security.conf;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    limit_conn liteedge_admin_conn 12;
    limit_conn_status 429;

    location /assets/ {
        limit_req zone=liteedge_admin_static burst=40 nodelay;
        limit_req_status 429;
        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;
        alias /opt/liteedge/ui/;
    }

    # Static SPA entrypoint, protected by Basic auth. The application uses
    # versioned JSON resources at /api/v1, never CGI-generated page navigation.
    location = / {
        # Internal rewrite only; the browser URL does not change.
        rewrite ^ /index.html last;
    }
    location = /index.html {
        limit_req zone=liteedge_admin_static burst=40 nodelay;
        limit_req_status 429;
        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;
        alias /opt/liteedge/ui/index.html;
    }

    # Machine credentials are scoped to provider state, never the admin API.
    location ^~ /api/v1/providers/ {
        client_max_body_size 4m;
        limit_req zone=liteedge_admin burst=30 nodelay;
        auth_basic off;
        include /opt/liteedge/etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/liteedge/cgi/provider.sh;
        fastcgi_param SCRIPT_NAME /provider.sh;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 180s;
        fastcgi_pass unix:@RUN_DIR@/fcgiwrap.sock;
    }

    location ^~ /api/v1/actions/ {
        client_max_body_size 4m;
        limit_req zone=liteedge_admin burst=30 nodelay;

        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;

        include /opt/liteedge/etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/liteedge/cgi/admin.sh;
        fastcgi_param SCRIPT_NAME /admin.sh;
        fastcgi_param HTTPS on;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:@RUN_DIR@/fcgiwrap.sock;
    }

    location / {
        client_max_body_size 256m;
        limit_req zone=liteedge_admin burst=30 nodelay;

        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;

        include /opt/liteedge/etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/liteedge/cgi/admin.sh;
        fastcgi_param SCRIPT_NAME /admin.sh;
        fastcgi_param HTTPS on;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:@RUN_DIR@/fcgiwrap.sock;
    }
}
