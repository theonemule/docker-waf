server {
    listen @BIND_ADDRESS@:@HTTP_PORT@ default_server;
    server_name _;

    include /opt/liteedge/etc/nginx/security.conf;

    location ^~ /.well-known/acme-challenge/ {
        root @DATA_DIR@/acme/challenges;
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen @BIND_ADDRESS@:@HTTPS_PORT@ ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen @BIND_ADDRESS@:@ADMIN_HTTPS_PORT@ ssl default_server;
    server_name _;

    ssl_certificate @DATA_DIR@/certs/_admin/fullchain.pem;
    ssl_certificate_key @DATA_DIR@/certs/_admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ADMINSSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    include /opt/liteedge/etc/nginx/security.conf;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location /assets/ {
        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;
        alias /opt/liteedge/ui/;
    }

    location / {
        client_max_body_size 32m;
        limit_req zone=liteedge_admin burst=30 nodelay;

        auth_basic "LiteEdge";
        auth_basic_user_file @DATA_DIR@/auth/.htpasswd;

        include /opt/liteedge/etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/liteedge/cgi/admin.sh;
        fastcgi_param SCRIPT_NAME /admin.sh;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:@RUN_DIR@/fcgiwrap.sock;
    }
}
