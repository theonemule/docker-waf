name: Kubernetes controller checks
on:
  # Full push validation lives in build-and-publish; this is a quick manual check.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: false
      - run: go test -count=1 -mod=readonly ./... && go vet -mod=readonly ./...
        working-directory: controller
      - run: python3 tests/test-provider.py && python3 tests/test-ha-config.py && python3 tests/test-nginx-generation.py
      - run: docker build --no-cache --pull -t lightedge-controller:checks-${{ github.run_id }} controller
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - run: |
          helm lint deploy/kubernetes/helm/lightedge --set provider.url=https://edge.example.com:9443
          helm lint deploy/kubernetes/helm/lightedge --set appliance.enabled=true
          helm template test deploy/kubernetes/helm/lightedge --set appliance.enabled=true >/dev/null
          helm template test deploy/kubernetes/helm/lightedge --set appliance.enabled=true --set 'appliance.extraHTTPPorts[0].port=8080,appliance.extraHTTPPorts[0].targetPort=18080,controller.extraHTTPPorts[0]=8080' >/dev/null
          helm template test deploy/kubernetes/helm/lightedge --set appliance.enabled=true --set 'appliance.extraHTTPSPorts[0].port=8443,appliance.extraHTTPSPorts[0].targetPort=18443,controller.extraHTTPSPorts[0]=8443' >/dev/null
          helm lint deploy/kubernetes/helm/lightedge --set appliance.enabled=true --set appliance.ha.enabled=true --set appliance.ha.existingClaim=shared-config --set appliance.ha.keySecret=ha-key
          helm template test deploy/kubernetes/helm/lightedge --set appliance.enabled=true --set controller.enableGRPC=true --set 'appliance.extraTCPPorts[0].port=9000,appliance.extraTCPPorts[0].targetPort=19000,appliance.extraUDPPorts[0].port=9001,appliance.extraUDPPorts[0].targetPort=19001,appliance.extraTLSPorts[0].port=9444,appliance.extraTLSPorts[0].targetPort=19444,controller.extraTCPPorts[0]=9000,controller.extraUDPPorts[0]=9001,controller.extraTLSPorts[0]=9444' >/dev/null
