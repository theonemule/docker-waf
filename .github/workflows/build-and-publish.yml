name: Build and qualify LightEdge and Kubernetes controller

on:
  push:
    branches: [master, "feature/**"]
    tags:
      - "v3.*"
  workflow_dispatch:

permissions:
  contents: read

# The repository-specific runner shares a physical dev host with the manual lab.
# Only trusted repository pushes and explicit dispatches execute on it.
concurrency:
  group: lightedge-build
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docker-waf
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/lightedge-controller

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          for tool in docker jq node python3 curl; do command -v "$tool"; done
          docker compose version
          docker info --format '{{.Name}}'
          python3 -c 'import yaml'
      - name: Install ShellCheck in runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lightedge-tools"
          curl -fsSL --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP/lightedge-tools" --strip-components=1 shellcheck-v0.10.0/shellcheck
          echo "$RUNNER_TEMP/lightedge-tools" >> "$GITHUB_PATH"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          for f in install.sh entrypoint.sh bin/*.sh cgi/*.sh scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck -x install.sh entrypoint.sh bin/*.sh cgi/*.sh scripts/*.sh
          ADMIN_PASSWORD=test docker compose config >/dev/null

      - name: Test installer and import contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-deployment.sh
          bash tests/test-observability.sh
          bash tests/test-otlp.sh
          bash tests/test-upgrade.sh
          bash tests/test-upgrade-alpine.sh
          bash tests/test-lb-health.sh
          bash tests/test-alert-selectors.sh
          bash tests/test-log-selectors.sh
          bash tests/test-native-nginx-migration.sh
          bash tests/test-acme-crs-integration.sh
          bash tests/test-admin-password.sh
          bash tests/test-vm-iso.sh
          python3 tests/test-iso-admin-setup.py
          node tests/test-backend-pool-ui.js
          node tests/test-spa-static.js
          node tests/test-spa-exporter.js
          node tests/test-spa-route-parity.js
          node tests/test-spa-log-filters.js
          node tests/test-spa-dropdown-dismiss.js
          node tests/test-ui-import.js
          node tests/test-logs-ui.js
          python3 tests/test-site-read.py
          python3 tests/test-http-api-coverage.py
          python3 tests/test-provider.py
          python3 tests/test-ha-config.py
          python3 tests/test-nginx-generation.py

  build-appliance:
    needs: validate
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      controller_version: ${{ steps.version.outputs.controller_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Select artifact version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source build/release.env
          version="$LITEEDGE_RELEASE"
          controller_version="$CONTROLLER_RELEASE"
          if [[ "$GITHUB_REF" == refs/tags/v3.* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag must match build/release.env"; exit 1; }
          else
            version="$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            controller_version="$controller_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "controller_version=$controller_version" >> "$GITHUB_OUTPUT"

      - name: Build standalone appliance payload from source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BUILD_JOBS=2 ./scripts/build-release.sh "${{ steps.version.outputs.version }}"
          cp scripts/install-alpine.sh dist/install-alpine.sh
          sed "s/^VERSION=v[0-9][0-9.]*/VERSION=v${{ steps.version.outputs.version }}/" scripts/upgrade-liteedge.sh > dist/upgrade-liteedge.sh
          chmod +x dist/upgrade-liteedge.sh
          # Bind the published installer to the exact release's Compose asset.
          sed "s/__LITEEDGE_RELEASE_TAG__/v${{ steps.version.outputs.version }}/g" install.sh > dist/install-docker.sh
          chmod +x dist/install-docker.sh
          cp docker-compose.yml dist/docker-compose.yml
          (cd dist && sha256sum docker-compose.yml > docker-compose.yml.sha256)
          (cd dist && sha256sum upgrade-liteedge.sh > upgrade-liteedge.sh.sha256)
          (cd dist && sha256sum install-alpine.sh install-docker.sh upgrade-liteedge.sh > installers.sha256)

      - name: Upload standalone appliance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-waf-v3-${{ steps.version.outputs.version }}-x86_64
          path: |
            dist/liteedge-linux-musl-x86_64.tar.gz
            dist/liteedge-linux-musl-x86_64.tar.gz.sha256
            dist/install-alpine.sh
            dist/install-docker.sh
            dist/upgrade-liteedge.sh
            dist/upgrade-liteedge.sh.sha256
            dist/docker-compose.yml
            dist/docker-compose.yml.sha256
            dist/installers.sha256
          if-no-files-found: error
          retention-days: 30

  build-iso:
    needs: build-appliance
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Download freshly built standalone binaries
        uses: actions/download-artifact@v4
        with:
          name: docker-waf-v3-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist

      - name: Build offline Alpine BIOS/UEFI installer ISO
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-vm-iso.sh "${{ needs.build-appliance.outputs.version }}"
          (cd dist && sha256sum -c "liteedge-vm-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso.sha256")

      - name: Build minimal offline bare-metal installer ISO
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-baremetal-iso.sh "${{ needs.build-appliance.outputs.version }}"
          (cd dist && sha256sum -c "liteedge-baremetal-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso.sha256")

      - name: Upload bootable bare-metal installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-waf-baremetal-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: |
            dist/liteedge-baremetal-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso
            dist/liteedge-baremetal-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso.sha256
            dist/baremetal-iso-validation.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload bootable VM installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-waf-vm-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: |
            dist/liteedge-vm-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso
            dist/liteedge-vm-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso.sha256
            dist/vm-iso-validation.log
          if-no-files-found: error
          retention-days: 30

  build-container:
    needs: build-appliance
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Download standalone appliance payload
        uses: actions/download-artifact@v4
        with:
          name: docker-waf-v3-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist

      - name: Build thin runtime image from prebuilt payload
        shell: bash
        run: |
          set -euo pipefail
          docker build --no-cache --pull --build-arg LITEEDGE_ARCH=x86_64 -t "${IMAGE_NAME}:ci" .

      - name: Rebuild Kubernetes controller from source
        shell: bash
        run: |
          set -euo pipefail
          docker build --no-cache --pull --build-arg CONTROLLER_VERSION="${{ needs.build-appliance.outputs.controller_version }}" -t lightedge-controller:ci controller

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name docker-waf-v3-ci \
            -e ADMIN_USER=admin \
            -e ADMIN_PASSWORD=test-password \
            -p 127.0.0.1:18080:8080 \
            -p 127.0.0.1:19443:9443 \
            "${IMAGE_NAME}:ci"

          trap 'docker logs docker-waf-v3-ci || true; docker rm -f docker-waf-v3-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            admin_code="$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:19443/ || true)"
            public_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)"
            if [[ "$admin_code" == "401" && "$public_code" == "404" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy." >&2
          exit 1

      - name: Migrate real previous release state
        shell: bash
        run: |
          set -euo pipefail
          for previous in v3.1.5 v3.1.6; do
            docker pull "ghcr.io/theonemule/docker-waf:$previous"
            bash tests/test-release-state-upgrade.sh "${IMAGE_NAME}:ci" "ghcr.io/theonemule/docker-waf:$previous"
          done
          bash tests/test-upgrade-compose-live.sh "${IMAGE_NAME}:ci" ghcr.io/theonemule/docker-waf:v3.1.6

      - name: End-to-end management API regressions in an isolated container
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-http-api-regression.sh "${IMAGE_NAME}:ci"
          bash tests/test-spa-api.sh "${IMAGE_NAME}:ci"
          bash tests/test-route-enhancements.sh "${IMAGE_NAME}:ci"
          bash tests/test-route-parity.sh "${IMAGE_NAME}:ci"
          bash tests/test-request-mirroring.sh "${IMAGE_NAME}:ci"
          bash tests/test-listener-ports.sh "${IMAGE_NAME}:ci"
          bash tests/test-https-listener-ports.sh "${IMAGE_NAME}:ci"
          bash tests/test-backend-retries.sh "${IMAGE_NAME}:ci"
          bash tests/test-request-deadlines.sh "${IMAGE_NAME}:ci"
          bash tests/test-backend-tls.sh "${IMAGE_NAME}:ci"
          bash tests/test-backend-tls-peers.sh "${IMAGE_NAME}:ci"
          bash tests/test-full-backup.sh "${IMAGE_NAME}:ci"
          bash tests/test-nginx-generations.sh "${IMAGE_NAME}:ci"
          bash tests/test-shared-waf-rules.sh "${IMAGE_NAME}:ci"
          bash tests/test-grpc.sh "${IMAGE_NAME}:ci"
          bash tests/test-stream-routes.sh "${IMAGE_NAME}:ci"
          bash tests/test-provider-integration.sh "${IMAGE_NAME}:ci"
          bash tests/test-shared-config-ha.sh "${IMAGE_NAME}:ci"
          printf 'FROM %s:ci\nUSER root\nCOPY tests/fixtures/dehydrated-ha-test.sh /opt/liteedge/bin/dehydrated\nRUN chmod 755 /opt/liteedge/bin/dehydrated\nUSER 10001:10001\n' "$IMAGE_NAME" | docker build --no-cache -t liteedge:ha-acme-test -f - .
          bash tests/test-shared-config-ha.sh liteedge:ha-acme-test offline-acme

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.3
      - name: Install kind
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          mkdir -p "$RUNNER_TEMP/lightedge-tools"
          install -m 0755 "$RUNNER_TEMP/kind" "$RUNNER_TEMP/lightedge-tools/kind"
          echo "$RUNNER_TEMP/lightedge-tools" >> "$GITHUB_PATH"
      - name: Kubernetes Ingress and Gateway smoke test
        run: bash tests/test-kubernetes-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci
      - name: Kubernetes multi-node HA and recovery
        run: HA_MULTINODE=1 bash tests/test-shared-config-ha-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci
      - name: Kubernetes Gateway partitions
        run: bash tests/test-gateway-partitions-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci
      - name: Kubernetes backend TLS
        run: bash tests/test-gateway-backend-tls-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci
      - name: Kubernetes extra routes
        run: bash tests/test-extra-routes-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci

      - name: Three-VM QEMU multi-protocol regression
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          export QEMU_CACHE_DIR
          QEMU_CACHE_DIR="$(mktemp -d "$RUNNER_TEMP/lightedge-qemu.XXXXXX")"
          trap 'rm -rf "$QEMU_CACHE_DIR"' EXIT
          bash tests/test-qemu-kubernetes.sh "${IMAGE_NAME}:ci" lightedge-controller:ci "$PWD/qemu-qualification"
      - name: Preserve QEMU regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightedge-qemu-qualification-${{ needs.build-appliance.outputs.version }}
          path: qemu-qualification/
          if-no-files-found: warn

      - name: Full Gateway API core qualification
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml"
          docker build --no-cache --pull -t lightedge-conformance:v1.4.0 controller/conformance
          mkdir -p qualification
          export CONFORMANCE_CLIENT_VALIDATED_FRONTEND=true
          export CONFORMANCE_VERSION="${{ needs.build-appliance.outputs.version }}"
          set +e
          CONFORMANCE_REPORT="$PWD/qualification/http.yaml" bash tests/test-gateway-conformance-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci lightedge-conformance:v1.4.0 >qualification/http.log 2>&1
          http_rc=$?
          CONFORMANCE_GRPC=true CONFORMANCE_PROFILE=GATEWAY-GRPC CONFORMANCE_FEATURES=Gateway,GRPCRoute,ReferenceGrant CONFORMANCE_REPORT="$PWD/qualification/grpc.yaml" bash tests/test-gateway-conformance-kind.sh "${IMAGE_NAME}:ci" lightedge-controller:ci lightedge-conformance:v1.4.0 >qualification/grpc.log 2>&1
          grpc_rc=$?
          set -e
          printf 'HTTP=%s GRPC=%s\n' "$http_rc" "$grpc_rc" | tee qualification/results.txt
          test "$http_rc" = 0 && test "$grpc_rc" = 0
          python3 tests/check-conformance-report.py qualification/http.yaml GATEWAY-HTTP "$CONFORMANCE_VERSION"
          python3 tests/check-conformance-report.py qualification/grpc.yaml GATEWAY-GRPC "$CONFORMANCE_VERSION"

      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-api-qualification-${{ needs.build-appliance.outputs.version }}
          path: qualification/
          if-no-files-found: warn

      - name: Package version-matched Kubernetes chart
        shell: bash
        env:
          APPLIANCE_VERSION: ${{ needs.build-appliance.outputs.version }}
          CONTROLLER_VERSION: ${{ needs.build-appliance.outputs.controller_version }}
        run: |
          set -euo pipefail
          chart="$(mktemp -d)"
          cp -a deploy/kubernetes/helm/lightedge "$chart/"
          sed -i "s|^  repository: .*lightedge-controller|  repository: $CONTROLLER_IMAGE|; s|^  tag: .*|  tag: \"v$CONTROLLER_VERSION\"|; s|^  image: .*docker-waf:.*|  image: $IMAGE_NAME:v$APPLIANCE_VERSION|" "$chart/lightedge/values.yaml"
          sed -i "s|^  lightedge.blaize.net/appliance-version:.*|  lightedge.blaize.net/appliance-version: \"$APPLIANCE_VERSION\"|" "$chart/lightedge/Chart.yaml"
          helm lint "$chart/lightedge" --set appliance.enabled=true
          helm lint "$chart/lightedge" --set provider.url=https://edge.example.com:9443
          mkdir -p qualification/package
          helm package "$chart/lightedge" --version "$CONTROLLER_VERSION" --app-version "$CONTROLLER_VERSION" --destination qualification/package
          (cd qualification/package && sha256sum ./*.tgz > chart.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: lightedge-helm-${{ needs.build-appliance.outputs.version }}
          path: qualification/package/
          if-no-files-found: error

      - name: Export exact qualified images for download
        shell: bash
        env:
          APPLIANCE_VERSION: ${{ needs.build-appliance.outputs.version }}
          CONTROLLER_VERSION: ${{ needs.build-appliance.outputs.controller_version }}
        run: |
          set -euo pipefail
          mkdir -p qualified-images
          docker tag "${IMAGE_NAME}:ci" "$IMAGE_NAME:v$APPLIANCE_VERSION"
          docker tag lightedge-controller:ci "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION"
          docker save "$IMAGE_NAME:v$APPLIANCE_VERSION" "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION" | gzip -1 > qualified-images/images.tar.gz
          docker image inspect "$IMAGE_NAME:v$APPLIANCE_VERSION" "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION" --format '{{.Id}} {{index .RepoTags 0}}' > qualified-images/image-ids.txt
          (cd qualified-images && sha256sum images.tar.gz image-ids.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-images-${{ needs.build-appliance.outputs.version }}
          path: qualified-images/
          if-no-files-found: error

  verify-artifacts:
    needs: [build-appliance, build-container, build-iso]
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@v4
        with:
          name: docker-waf-v3-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: docker-waf-vm-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: docker-waf-baremetal-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: lightedge-helm-${{ needs.build-appliance.outputs.version }}
          path: chart
      - uses: actions/download-artifact@v4
        with:
          name: qualified-images-${{ needs.build-appliance.outputs.version }}
          path: qualified-images
      - name: Verify all downloadable deliverables
        shell: bash
        env:
          APPLIANCE_VERSION: ${{ needs.build-appliance.outputs.version }}
          CONTROLLER_VERSION: ${{ needs.build-appliance.outputs.controller_version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c *.sha256 && sha256sum -c installers.sha256)
          (cd chart && sha256sum -c chart.sha256)
          (cd qualified-images && sha256sum -c SHA256SUMS)
          test -s "dist/liteedge-vm-installer-$APPLIANCE_VERSION-x86_64.iso"
          test -s "dist/liteedge-baremetal-installer-$APPLIANCE_VERSION-x86_64.iso"
          test -s "chart/lightedge-$CONTROLLER_VERSION.tgz"
          test -s dist/liteedge-linux-musl-x86_64.tar.gz
          test -s qualified-images/images.tar.gz
          tar -xOf dist/liteedge-linux-musl-x86_64.tar.gz opt/liteedge/VERSION | grep -Fx "LiteEdge=$APPLIANCE_VERSION"
          gzip -t qualified-images/images.tar.gz
          docker load -i qualified-images/images.tar.gz
          docker image inspect "$IMAGE_NAME:v$APPLIANCE_VERSION" "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION" --format '{{.Id}} {{index .RepoTags 0}}' > verified-image-ids.txt
          # Compare the immutable image IDs; the first tag can vary on a shared daemon.
          diff <(awk '{print $1}' qualified-images/image-ids.txt) <(awk '{print $1}' verified-image-ids.txt)
          {
            echo '## Complete qualification passed'
            echo "Source: $GITHUB_SHA"
            echo "Appliance: $APPLIANCE_VERSION"
            echo "Controller: $CONTROLLER_VERSION"
            echo 'All required build, integration, conformance and artifact checksum gates passed.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: [build-appliance, build-container, build-iso, verify-artifacts]
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-images-${{ needs.build-appliance.outputs.version }}
          path: qualified-images
      - name: Publish exact qualified appliance and controller images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIANCE_VERSION: ${{ needs.build-appliance.outputs.version }}
          CONTROLLER_VERSION: ${{ needs.build-appliance.outputs.controller_version }}
        run: |
          set -euo pipefail
          (cd qualified-images && sha256sum -c SHA256SUMS)
          docker load -i qualified-images/images.tar.gz
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_NAME:v$APPLIANCE_VERSION"
          docker push "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION"
          for tag in v3 latest; do
            docker tag "$IMAGE_NAME:v$APPLIANCE_VERSION" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
          docker tag "$CONTROLLER_IMAGE:v$CONTROLLER_VERSION" "$CONTROLLER_IMAGE:v1"
          docker push "$CONTROLLER_IMAGE:v1"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: [build-appliance, build-container, build-iso, verify-artifacts, publish-images]
    runs-on: [self-hosted, Linux, X64, ci163-waf]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-waf-v3-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist

      - name: Download VM installer ISO
        uses: actions/download-artifact@v4
        with:
          name: docker-waf-vm-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist

      - name: Download bare-metal installer ISO
        uses: actions/download-artifact@v4
        with:
          name: docker-waf-baremetal-iso-${{ needs.build-appliance.outputs.version }}-x86_64
          path: dist

      - name: Download matched Helm chart
        uses: actions/download-artifact@v4
        with:
          name: lightedge-helm-${{ needs.build-appliance.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          (cd dist && sha256sum -c *.sha256)
          test -s "dist/liteedge-linux-musl-x86_64.tar.gz"
          test -s "dist/upgrade-liteedge.sh"
          (cd dist && sha256sum -c upgrade-liteedge.sh.sha256)
          test -s "dist/liteedge-vm-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso"
          test -s "dist/liteedge-baremetal-installer-${{ needs.build-appliance.outputs.version }}-x86_64.iso"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$tag" --target "$GITHUB_SHA" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$tag" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$GITHUB_SHA" \
              --title "LightEdge $tag — controller v${{ needs.build-appliance.outputs.controller_version }}, binaries and installers" \
              --generate-notes
          fi
